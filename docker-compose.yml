services:
  server:
    # Pre-built image from GitHub Container Registry — built on every push to main via GitHub Actions
    # Deploy version: 3
    image: ghcr.io/se2-doomhamsters/server:latest
    pull_policy: always

    # Restart automatically on crash; skip restart only if manually stopped
    restart: unless-stopped

    ports:
      # <university-server-port>:<container-internal-port>
      - "53217:8080"

    deploy:
      resources:
        limits:
          # Measured peak under active gameplay: 3% CPU across all cores.
          # Set to 0.50 to give the JVM burst room for GC and spike connections
          # without starving other containers on the host.
          cpus: '0.50'

          # Measured peak under active gameplay: ~400 MB.
          # Limit is 1.5× the peak (600 MB) because the JVM heap can spike
          # sharply during garbage collection — Docker OOM-kills the container
          # the moment it exceeds the limit, so headroom is critical.
          memory: 600M

        reservations:
          # Guarantees the container always gets at least its measured baseline.
          # Prevents the host from over-committing memory to other containers.
          memory: 400M

    environment:
      # Override default sessions.json path to write inside the Docker volume
      - SESSIONS_FILE_PATH=/data/sessions.json

    volumes:
      # Persists game sessions across container restarts and redeployments
      # Lives on the host at /var/lib/docker/volumes/server_sessions_data/
      - sessions_data:/data

    healthcheck:
      # Docker checks this endpoint every 30s to determine container health
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s   # how often to check
      timeout: 5s     # max time to wait for a response
      retries: 3      # consecutive failures before marking unhealthy

volumes:
  # Named volume — managed by Docker, survives container recreation by doco-cd
  sessions_data:
